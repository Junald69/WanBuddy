name: WanBuddy
options:
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: ja
  knownRegions:
    - ja
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Beta: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_LANGUAGE: ja
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
  # Project-level only. WanBuddy's target xcconfig (configFiles) is applied
  # above this level, so it stays the source of SWIFT_ACTIVE_COMPILATION_CONDITIONS.
  # $(inherited) keeps this level from adding a second flag list.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    Beta:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

packages:
  WanBuddyCore:
    path: ../Packages/WanBuddyCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6

targets:
  WanBuddy:
    type: application
    platform: iOS
    sources:
      - path: WanBuddy
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/Debug.xcconfig
      Beta: Config/Beta.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: WanBuddyCore
        product: WanBuddyCore
      - package: Supabase
        product: Supabase
    preBuildScripts:
      - name: Check environment configuration
        basedOnDependencyAnalysis: false
        script: |
          bash "${SRCROOT}/../scripts/check_env.sh"

schemes:
  WanBuddy:
    build:
      targets:
        WanBuddy: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Beta
    analyze:
      config: Debug
    archive:
      config: Release
